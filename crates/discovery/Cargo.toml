[package]
name = "nexus-discovery"
description = "Read-only provider discovery adapters for NEXUS ZERO"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nexus-domain = { path = "../domain" }
nexus-graph = { path = "../graph" }
# Optional, never compiled in this repo yet: crates.io was unreachable when added.
ureq = { version = "2", optional = true }

[features]
# Real HTTPS transport (`http::UreqTransport`). Off by default.
http = ["dep:ureq"]

[dev-dependencies]
nexus-analysis = { path = "../analysis" }
